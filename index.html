<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Judy's Games</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1f4a3a;color:#fff;font-family:Verdana,Arial,sans-serif;font-size:24px}
.bar{display:flex;gap:10px;padding:8px;background:#163528;flex-wrap:wrap;align-items:center}
.bar button,.bar a{font-size:26px;padding:12px 18px;border-radius:12px;border:3px solid #fff;background:#fdf6e3;color:#111;text-decoration:none;font-weight:bold;min-height:60px}
.bar .msg{flex:1;min-width:200px;font-size:26px;text-align:center}
.banner{display:none;margin:10px auto;max-width:700px;background:#fdf6e3;color:#111;border-radius:16px;padding:18px;text-align:center;font-size:28px}
h1{text-align:center;font-size:44px;margin:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:20px;max-width:1100px;margin:auto}
.grid a{display:block;background:#fdf6e3;color:#111;text-decoration:none;border-radius:24px;padding:30px;text-align:center;font-size:36px;font-weight:bold;border:5px solid #fff}
.grid a span{display:block;font-size:80px}</style></head><body>
<h1>Judy's Games</h1><div class="grid">

</body></html>
